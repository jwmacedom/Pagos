<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alquiler de Cuartos</title>
  <style>
    /* Estilos Generales */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #333;
    }

    /* Galería de Cuartos */
    .contenedor-cuartos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }

    .tarjeta-cuarto {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .tarjeta-cuarto:hover {
      transform: translateY(-5px);
    }

    .tarjeta-cuarto img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .tarjeta-cuarto .info {
      padding: 15px;
    }

    .tarjeta-cuarto h3 {
      margin: 0 0 10px 0;
      color: #2c3e50;
    }

    .tarjeta-cuarto p {
      margin: 0;
      color: #666;
      font-size: 14px;
    }

    /* Ventana Emergente (Modal) */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .encabezado-modal {
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .encabezado-modal img {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
    }

    .encabezado-modal h2 {
      margin: 0;
      font-size: 20px;
      color: #2c3e50;
    }

    /* Formularios y Campos */
    .campo {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }

    .campo label {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #444;
    }

    .campo input, .campo select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    /* Botones */
    .acciones {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-regresar {
      background-color: #e74c3c;
      color: white;
    }

    .btn-confirmar {
      background-color: #2ecc71;
      color: white;
    }

    /* Sección para Mostrar Datos Guardados */
    .resultado {
      margin-top: 15px;
      padding: 10px;
      background-color: #e8f8f5;
      border: 1px solid #a3e4d7;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Alquiler de Cuartos</h1>

  <!-- Galería de Cuartos -->
  <div class="contenedor-cuartos">
    <div class="tarjeta-cuarto" onclick="abrirModal('Cuarto 1A', 'https://via.placeholder.com/300x180?text=Cuarto+1A', 'Cuarto amplio con ventana a la calle.')">
      <img src="https://via.placeholder.com/300x180?text=Cuarto+1A" alt="Cuarto 1A">
      <div class="info">
        <h3>Cuarto 1A</h3>
        <p>Cuarto amplio con ventana a la calle.</p>
      </div>
    </div>

    <div class="tarjeta-cuarto" onclick="abrirModal('Cuarto 2B', 'https://via.placeholder.com/300x180?text=Cuarto+2B', 'Cuarto en 2do piso con baño propio.')">
      <img src="https://via.placeholder.com/300x180?text=Cuarto+2B" alt="Cuarto 2B">
      <div class="info">
        <h3>Cuarto 2B</h3>
        <p>Cuarto en 2do piso con baño propio.</p>
      </div>
    </div>
  </div>

  <!-- Ventana Emergente (Modal) -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="encabezado-modal">
        <h2 id="modal-titulo">Cuarto 2B</h2>
        <img id="modal-img" src="" alt="Miniatura">
      </div>

      <!-- Campo Fecha de Pago -->
      <div class="campo">
        <label for="fecha">Fecha de pago:</label>
        <input type="date" id="fecha">
      </div>

      <!-- Campo Monto de Pago -->
      <div class="campo">
        <label for="monto">Monto de pago:</label>
        <select id="monto">
          <option value="90">90</option>
          <option value="100">100</option>
          <option value="110">110</option>
          <option value="120">120</option>
          <option value="130">130</option>
          <option value="140">140</option>
        </select>
      </div>

      <!-- Campo Mes Cancelado -->
      <div class="campo">
        <label for="mes">Mes cancelado:</label>
        <select id="mes">
          <option value="Enero">Enero</option>
          <option value="Febrero">Febrero</option>
          <option value="Marzo">Marzo</option>
          <option value="Abril">Abril</option>
          <option value="Mayo">Mayo</option>
          <option value="Junio">Junio</option>
          <option value="Julio">Julio</option>
          <option value="Agosto">Agosto</option>
          <option value="Septiembre">Septiembre</option>
          <option value="Octubre">Octubre</option>
          <option value="Noviembre">Noviembre</option>
          <option value="Diciembre">Diciembre</option>
        </select>
      </div>

      <!-- Botones de Acción -->
      <div class="acciones">
        <button class="btn btn-regresar" onclick="cerrarModal()">REGRESAR</button>
        <button class="btn btn-confirmar" onclick="guardarDatos()">CONFIRMAR</button>
      </div>

      <!-- Área de Confirmación / Registro Guardado -->
      <div class="resultado" id="resultado"></div>
    </div>
  </div>

  <script>
    // Función para abrir la ventana emergente con la información del cuarto seleccionado
    function abrirModal(nombre, imagen, descripcion) {
      document.getElementById('modal-titulo').innerText = nombre;
      document.getElementById('modal-img').src = imagen;

      // Establecer la fecha actual de forma automática
      const hoy = new Date();
      const fechaFormateada = hoy.toISOString().split('T')[0];
      document.getElementById('fecha').value = fechaFormateada;

      // Seleccionar el mes actual automáticamente
      const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
      const mesActual = meses[hoy.getMonth()];
      document.getElementById('mes').value = mesActual;

      // Ocultar resultados previos y mostrar la ventana
      document.getElementById('resultado').style.display = 'none';
      document.getElementById('overlay').style.display = 'flex';
    }

    // Función para cerrar la ventana emergente
    function cerrarModal() {
      document.getElementById('overlay').style.display = 'none';
    }

    // Función para guardar y mostrar la información al confirmar
    function guardarDatos() {
      const fecha = document.getElementById('fecha').value;
      const monto = document.getElementById('monto').value;
      const mes = document.getElementById('mes').value;
      const cuarto = document.getElementById('modal-titulo').innerText;

      const cajaResultado = document.getElementById('resultado');
      cajaResultado.innerHTML = `
        <strong>¡Datos guardados con éxito!</strong><br>
        • <strong>Cuarto:</strong> ${cuarto}<br>
        • <strong>Fecha:</strong> ${fecha}<br>
        • <strong>Monto:</strong> S/ ${monto}<br>
        • <strong>Mes:</strong> ${mes}
      `;
      cajaResultado.style.display = 'block';
    }
  </script>
</body>
</html>
