<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alquiler de Cuartos - Cloud</title>
  
  <!-- Importar la librería oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 { color: #333; }

    /* Galería de Cuartos */
    .contenedor-cuartos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }

    .tarjeta-cuarto {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .tarjeta-cuarto:hover { transform: translateY(-5px); }

    .tarjeta-cuarto img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .tarjeta-cuarto .info { padding: 15px; }
    .tarjeta-cuarto h3 { margin: 0 0 10px 0; color: #2c3e50; }
    .tarjeta-cuarto p { margin: 0; color: #666; font-size: 14px; }

    /* Ventana Emergente (Modal) */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      max-height: 90vh;
      overflow-y: auto;
    }

    .encabezado-modal {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .encabezado-modal img {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
    }

    .encabezado-modal h2 { margin: 0; font-size: 20px; color: #2c3e50; }

    .campo {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }

    .campo label {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #444;
    }

    .campo input, .campo select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    .acciones {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-regresar { background-color: #e74c3c; color: white; }
    .btn-confirmar { background-color: #2ecc71; color: white; }

    /* Lista de Pagos Registrados */
    .historial-titulo {
      margin-top: 20px;
      font-size: 14px;
      font-weight: bold;
      color: #333;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }

    .tarjeta-pago {
      background-color: #e8f8f5;
      border: 1px solid #a3e4d7;
      border-radius: 6px;
      padding: 10px;
      margin-top: 10px;
      position: relative;
      font-size: 13px;
    }

    .btn-eliminar {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }

    .btn-eliminar:hover { background: #c0392b; }
  </style>
</head>
<body>

  <h1>Alquiler de Cuartos</h1>

  <!-- Galería de Cuartos -->
  <div class="contenedor-cuartos">
    <div class="tarjeta-cuarto" onclick="abrirModal('Cuarto 1A', 'https://picsum.photos/id/1040/300/180')">
      <img src="https://picsum.photos/id/1040/300/180" alt="Cuarto 1A">
      <div class="info">
        <h3>Cuarto 1A</h3>
        <p>Cuarto amplio con ventana a la calle.</p>
      </div>
    </div>

    <div class="tarjeta-cuarto" onclick="abrirModal('Cuarto 2B', 'https://picsum.photos/id/1068/300/180')">
      <img src="https://picsum.photos/id/1068/300/180" alt="Cuarto 2B">
      <div class="info">
        <h3>Cuarto 2B</h3>
        <p>Cuarto en 2do piso con baño propio.</p>
      </div>
    </div>
  </div>

  <!-- Ventana Emergente (Modal) -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="encabezado-modal">
        <h2 id="modal-titulo">Cuarto</h2>
        <img id="modal-img" src="" alt="Cuarto">
      </div>

      <div class="campo">
        <label for="fecha">Fecha de pago:</label>
        <input type="date" id="fecha">
      </div>

      <div class="campo">
        <label for="monto">Monto de pago:</label>
        <select id="monto">
          <option value="90">90</option>
          <option value="100">100</option>
          <option value="110">110</option>
          <option value="120">120</option>
          <option value="130">130</option>
          <option value="140">140</option>
        </select>
      </div>

      <div class="campo">
        <label for="mes">Mes cancelado:</label>
        <select id="mes">
          <option value="Enero">Enero</option>
          <option value="Febrero">Febrero</option>
          <option value="Marzo">Marzo</option>
          <option value="Abril">Abril</option>
          <option value="Mayo">Mayo</option>
          <option value="Junio">Junio</option>
          <option value="Julio">Julio</option>
          <option value="Agosto">Agosto</option>
          <option value="Septiembre">Septiembre</option>
          <option value="Octubre">Octubre</option>
          <option value="Noviembre">Noviembre</option>
          <option value="Diciembre">Diciembre</option>
        </select>
      </div>

      <div class="acciones">
        <button class="btn btn-regresar" onclick="cerrarModal()">REGRESAR</button>
        <button class="btn btn-confirmar" onclick="guardarDatos()">CONFIRMAR</button>
      </div>

      <div class="historial-titulo">Pagos Registrados en la Nube:</div>
      <div id="lista-pagos">Cargando...</div>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN DE SUPABASE (¡MODIFICAR AQUÍ!)
    // ==========================================
    const SUPABASE_URL = 'https://fnnbiavucfgjqyrepzkw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_L6F_zQiQS08gVeas9ePvqQ_4MDWO0RQ';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let cuartoActual = '';

    // Abrir modal y cargar registros desde Supabase
    function abrirModal(nombre, imagen) {
      cuartoActual = nombre;
      document.getElementById('modal-titulo').innerText = nombre;
      document.getElementById('modal-img').src = imagen;

      const hoy = new Date();
      document.getElementById('fecha').value = hoy.toISOString().split('T')[0];

      const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
      document.getElementById('mes').value = meses[hoy.getMonth()];

      mostrarPagos();
      document.getElementById('overlay').style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('overlay').style.display = 'none';
    }

    // Guardar datos directo a la base de datos de Supabase
    async function guardarDatos() {
      const fecha = document.getElementById('fecha').value;
      const monto = parseFloat(document.getElementById('monto').value);
      const mes = document.getElementById('mes').value;

      if (!fecha) {
        alert("Selecciona una fecha válida.");
        return;
      }

      const { error } = await supabaseClient
        .from('pagos')
        .insert([{ cuarto: cuartoActual, fecha, monto, mes }]);

      if (error) {
        alert("Error al guardar: " + error.message);
      } else {
        mostrarPagos(); // Recarga la lista instantáneamente
      }
    }

    // Consultar pagos desde Supabase
    async function mostrarPagos() {
      const contenedor = document.getElementById('lista-pagos');
      contenedor.innerHTML = 'Cargando...';

      const { data: pagos, error } = await supabaseClient
        .from('pagos')
        .select('*')
        .eq('cuarto', cuartoActual)
        .order('id', { ascending: false });

      if (error) {
        contenedor.innerHTML = 'Error al cargar los pagos.';
        return;
      }

      if (pagos.length === 0) {
        contenedor.innerHTML = '<p style="font-size:12px; color:#888;">No hay pagos registrados aún.</p>';
        return;
      }

      contenedor.innerHTML = '';
      pagos.forEach(pago => {
        const item = document.createElement('div');
        item.className = 'tarjeta-pago';
        item.innerHTML = `
          <button class="btn-eliminar" onclick="eliminarPago(${pago.id})">Eliminar</button>
          • <strong>Fecha:</strong> ${pago.fecha}<br>
          • <strong>Monto:</strong> S/ ${pago.monto}<br>
          • <strong>Mes:</strong> ${pago.mes}
        `;
        contenedor.appendChild(item);
      });
    }

    // Eliminar un registro de Supabase
    async function eliminarPago(id) {
      if (confirm("¿Estás seguro de eliminar este registro de la nube?")) {
        const { error } = await supabaseClient
          .from('pagos')
          .delete()
          .eq('id', id);

        if (error) {
          alert("No se pudo eliminar: " + error.message);
        } else {
          mostrarPagos();
        }
      }
    }
  </script>
</body>
</html>
